input_csv: data/sample/sample_24h.csv
output_dir: outputs
solver: highs
# Grid connection export limit in MW (wind to grid + battery discharge).
# null = unconstrained connection. Example: 60.0
grid_export_limit_mw: null

# Let the battery buy from the grid to charge (price arbitrage). Off by default because many
# wind support schemes forbid it. import_fee_eur_per_mwh is added to the market price of
# every imported MWh: 10 EUR/MWh is roughly Energinet's 2026 system tariff (7.2 ore/kWh);
# distribution-connected sites pay ~6 EUR/MWh more, and capacity charges and taxes are excluded.
grid_charging:
  enabled: false
  import_limit_mw: null
  import_fee_eur_per_mwh: 10.0

# Cycle-based battery degradation, priced per MWh charged or discharged:
#   cost = cell_replacement_cost / (2 x cycle_life)  -> 75,000 / 15,000 = 5 EUR/MWh throughput
# Acts as a sinking fund for cell replacement (do not add replacement capex on top).
# 7,500 full cycles is ~72 % remaining capacity on Modo Energy's standard LFP curve;
# 75,000 EUR/MWh is a placeholder above BNEF's 2025 stationary pack price of $70/kWh to
# cover installation and disposal.
degradation:
  enabled: true
  cell_replacement_cost_eur_per_mwh: 75000.0
  cycle_life_full_cycles: 7500.0
  calendar_life_years: 20.0

battery:
  energy_capacity_mwh: 100.0
  charge_power_mw: 25.0
  discharge_power_mw: 25.0
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  min_soc_mwh: 10.0
  max_soc_mwh: 100.0
  initial_soc_mwh: 50.0
  terminal_soc_mwh: 50.0
  throughput_cost_eur_per_mwh: 0.0

# Investment assumptions for `energy-hub size` and the dashboard sizing tab.
# Placeholders within the 2025-2026 published range for European utility-scale BESS;
# replace with project quotes. Capex = energy part (per MWh) + power part (per MW).
investment:
  energy_capex_eur_per_mwh: 100000.0
  power_capex_eur_per_mw: 250000.0
  fixed_om_pct_of_capex: 0.02
  lifetime_years: 15
  discount_rate: 0.08
  annual_revenue_degradation: 0.02
